<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120a14">
<title>Paridhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,500;1,9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- START -->
<section id="start">
  <p class="eyebrow">for one person only · <span data-fill="date"></span></p>
  <h1 data-fill="name"></h1>
  <p class="start-sub">This page doesn't run on wifi.<br><em>It runs on you.</em></p>
  <p class="start-how">Sound on. Phone in your hand.<br>When the beat starts, don't stand still.</p>
  <button id="go" type="button">5 · 6 · 7 · 8</button>
</section>

<!-- THE FLOOR -->
<main id="floor" hidden>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="stage" id="stage">
    <svg class="arc" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="arc-bg" cx="50" cy="50" r="46"/>
      <circle class="arc-fg" id="arc" cx="50" cy="50" r="46"/>
    </svg>
    <div class="record" id="record" role="button" tabindex="0" aria-label="Tap or spin the record">
      <div class="label"><span class="l-name" data-fill="name"></span><span class="l-side" id="lside">side A · tap me</span></div>
    </div>
    <div id="ring"></div>
  </div>
  <div class="meter"><i id="o2"></i></div>
  <p class="hint" id="hint">dance with your phone · tap the record · or spin it</p>
</main>

<!-- A TRACK -->
<div id="sheet" hidden>
  <button class="x" id="close" type="button" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</div>

<!-- THE CIRCLE CLOSES -->
<section id="finale" hidden>
  <button class="x" id="closeFinale" type="button" aria-label="Close">×</button>
  <div class="fin-inner">
    <p class="eyebrow">the circle is closed</p>
    <p class="meaning" data-fill="meaning"></p>
    <div class="letter" id="letter"></div>
    <p class="sign">— <span data-fill="from"></span></p>
    <button id="bow" type="button">Take your bow</button>
  </div>
</section>

<div id="toast" aria-live="polite"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
